<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <title>The Powerpuff Girls in Mojo for Mayor</title>
    <style>
        body {
            background-color: black;
            color: white;
            padding: 0px;
            margin: 0px;
        }

        .monogame {
            display: block;
        }

        div.monogame {
            text-align: center;
        }

        div.monogame_border {
            border: 0px none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas.monogame {
            border: 0px none;
            background-color: black;
            object-fit: contain;
            max-height: 100%;
            max-width: 100%;
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="bridge.min.js" defer></script>
    <script src="bridge.meta.min.js" defer></script>
    <script src="MonoGame.Framework.min.js" defer></script>
    <script src="MonoGame.Framework.meta.min.js" defer></script>
    <script src="PPGTV.min.js" defer></script>
    <script src="PPGTV.meta.min.js" defer></script>
</head>
<body>
    <div class="monogame" id="status">Loading...</div>
    <div class="monogame_border">
        <canvas class="monogame" id="monogamecanvas"></canvas>
    </div>
</body>
</html>
